name: Instagram 自動投稿

on:
  schedule:
    - cron: '*/30 * * * *' # 30分おき（GitHub の混雑で数分〜十数分遅れることがあります）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 予約投稿を実行
        run: node scripts/instagram-publish.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      # 投稿済み / エラーの状態をリポジトリに記録（[skip ci] でサイトの再ビルドはしない）
      - name: 投稿結果を保存
        if: always()
        run: |
          if [ -n "$(git status --porcelain instagram/posts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add instagram/posts
            git commit -m "Instagram: 投稿結果を記録 [skip ci]"
            git push
          fi
