name: Instagram 自動投稿

on:
  schedule:
    # 予備の見回り。GitHub の混雑で数時間遅れることがあるので、ふだんは
    # instagram/cron-worker（Cloudflare）が5分おきに確認して workflow_dispatch で起動する
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 順番待ちの間に別の実行が投稿結果を記録していても二重投稿しないよう、最新の main を取る
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 予約投稿を実行
        run: node scripts/instagram-publish.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      # 投稿済み / エラーの状態をリポジトリに記録（[skip ci] でサイトの再ビルドはしない）
      - name: 投稿結果を保存
        if: always()
        run: |
          if [ -n "$(git status --porcelain instagram/posts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add instagram/posts
            git commit -m "Instagram: 投稿結果を記録 [skip ci]"
            git push
          fi
